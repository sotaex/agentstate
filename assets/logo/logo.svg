<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Antinel">
<!--
  Antinel 标志 —— 按 2026-09-27 定稿 R4 方案（antinel-logo-final）重绘。
  ★ 为什么不用那张 PNG：① 它带「AI生成 WORKBUDDY」水印，不能上站；
    ② 它是 1024px 位图，网页与 favicon 都要缩放，小尺寸下发虚。
  ★ 几何逐条照抄定稿图（比对 R4_官网横幅.png 量出来的）：
    · 底色 深绿黑 #0a1a12
    · 探针环 四段等宽，**左侧 9 点至 11 点方向开口**
    · 哨点 橙色圆点，位于**左上约 10 点位**
    · 指针 从哨点**斜指向右下圆心**，灰色 #9aa39a
  ★ 含义：哨点在转、探针在扫 —— 值守(L0) → 注意(L1) → 拦截(L2) → 失守(R0)。
  ★ 环色 #6d8a72、哨点色 #f0a03c（取自定稿图）。
-->
  <rect width="64" height="64" rx="10" fill="#0a1a12"/>
  <g fill="none" stroke="#6d8a72" stroke-width="7" stroke-linecap="butt">
    <path d="M33.7 8.2 A 23.5 23.5 0 0 1 55.8 32"/>
    <path d="M55.8 35.8 A 23.5 23.5 0 0 1 35.8 55.8"/>
    <path d="M28.2 55.8 A 23.5 23.5 0 0 1 8.2 32"/>
    <path d="M8.2 28.2 A 23.5 23.5 0 0 1 19.5 10.6"/>
  </g>
  <path d="M21.6 18.4 L 34.5 32.4" fill="none" stroke="#9aa39a" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="18.6" cy="15.4" r="5" fill="#f0a03c"/>
</svg>
