name: harness
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run verification suite (310 assertions, zero-network, stdlib-only)
        run: python scripts/run_harness.py
      - name: Run invariants (INV-1..INV-6)
        run: python tools/antinel_verify.py --invariants
