name: harness
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ★ 0.34.0：断言总数**不写死**在此处。分母由套件自己得出
      #   （run_harness 从 last_results.json 数），因此套件增减断言时本文件
      #   不会变成一个说谎的数字 —— 此前这里写死 "310 assertions"，
      #   而真实分母已是 315，写死＝每次增删断言都留下一处陈旧数字。
      - name: Run verification suite (assertion count is derived, not pinned here)
        run: python scripts/run_harness.py
      - name: Run invariants (INV-1..INV-6)
        run: python tools/antinel_verify.py --invariants

  # ★ 0.34.0：把三个此前**没有任何 workflow 引用**的守卫接进来。
  #   它们已存在、已跑得通，只是没人调用 ⇒ 等于没有守卫
  #   （本项目铁律：「无检查项的禁令＝没禁令」「假守卫比没守卫更坏」）。
  #   三个都很快，因此放在快速档，与套件并行无关、互不阻塞。
  guards:
    name: guards (version / regression / drift)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # D-6：十处版本承载件必须逐字相同。--expect 从 antinel.py 的 VERSION 常量
      # 派生，所以升版时这个检查**自己会知道**该期望什么，不需人记得改
      # （此前 D-6 只在本地手工跑，CI 里没有任何 workflow 引用它）。
      - name: D-6 version carriers agree
        shell: pwsh
        run: |
          $v = (Select-String -Path antinel.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "expect version = $v"
          python ci/version_check.py --expect $v
      # L7 回归闸门：把已修好的缺陷固化成判据（< 5 秒，供每次改动后立刻跑）
      - name: L7 regression gate
        run: python ci/regression_gate.py
      # 漂移审计：需求文件 → 盘上行为，逐条机械化验证
      - name: Drift audit (requirements vs on-disk behaviour)
        run: python ci/drift_audit.py

  # ★★ 0.36.5：统一交付闸门接进 CI（第三个强制执行点，也是**云端唯一**那一处）。
  #   为什么单开一个 job 而不是并进上面的 guards：
  #     · guards 里的三项是**各自**被 workflow 点名调用的 —— 这次我数了一遍，
  #       发现**113 条Antinel 监理判据 ＋ 7 条交付自检，一条都没被点过名**。
  #       也就是说：本轮之前，Antinel 监理的任何缺陷在 GitHub Actions 上
  #       **根本不存在被检查的可能**（不是"没发现"，是"没跑"）。
  #     · 统一入口的意义正是**消灭"要记得逐个点名"这件事**：
  #       以后新增判据只需登记进 `ci/delivery_gate.py::SUITES`，
  #       本 job 自动覆盖 —— 不再依赖"谁记得在 yml 里加一行"。
  #   失败语义与本地一致：变红 / 崩或缺失 / 零输出，三种都不许当通过。
  delivery-gate:
    name: delivery gate (all registered guard suites)
    runs-on: windows-latest        # Antinel 监理判据用 ctypes 调 Win32，Linux 跑不了
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unified delivery gate (registered suites + self-check)
        run: python ci/delivery_gate.py --json
      # ★ 负控也进 CI：验证"闸门本身是闸门"。
      #   不会红的闸门是装饰 —— 而"闸门被改坏后 CI 仍然绿"这件事，
      #   只有把负控也跑起来才抓得到。
      - name: Delivery gate self-check (must go RED when a guard is broken)
        run: python ci/delivery_gate.py --selfcheck
      # ★★ 小泡泡根治措施的负控（0.36.5 新增，进 CI 的理由）：
      #   F1–F4/G2 是"右下角又冒小泡泡"那个遗留的根治措施。
      #   它们各自的负控在本地跑过 8/8 全红，但**"本地跑过"不是"每次都会跑"**
      #   —— 这正是本轮最初那个缺口的镜像（判据存在但零调用方）。
      #   ⇒ 放 CI 而不是放打包前闸门：负控会**临时改坏产品文件再还原**，
      #     若随打包跑，进程被杀就会把变异后的代码打进包里。
      #   ⇒ 这是"该跑的时候跑、该查的时候查"的分工，不是漏接。
      - name: Bubble-suppression negative controls (F1-F4/G2 must go RED)
        run: python _p_bubble_negctl.py
